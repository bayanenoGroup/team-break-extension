# nafas.bayaneno.com as installed on the bayaneno server.
# Lives in its own file (/etc/nginx/nafas.bayaneno.com.conf), included from
# /etc/nginx/nginx-includes.conf (http level), so DirectAdmin never rewrites it.
# ArvanCloud terminates HTTPS for visitors and does not verify the origin
# certificate, so port 443 uses the server's default certificate.
# Listen on the exact IP like the DirectAdmin vhosts, or nginx will not
# pick this server block.

server {
    listen 185.116.162.191:80;
    server_name nafas.bayaneno.com;
    return 301 https://$host$request_uri;
}

server {
    listen 185.116.162.191:443 ssl;
    http2 on;
    server_name nafas.bayaneno.com;
    root /home/bayaneno/domains/nafas/server-php/public;

    ssl_certificate     /etc/nginx/ssl.crt/server.crt.combined;
    ssl_certificate_key /etc/nginx/ssl.key/server.key;

    client_max_body_size 16k;
    access_log /var/log/nginx/nafas.access.log;
    error_log  /var/log/nginx/nafas.error.log;

    # Only the front controller is ever executed; no other file is served.
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php-fpm/php74-1002.sock;
    }
}
