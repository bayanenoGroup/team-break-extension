# nafas.bayaneno.com — example vhost. Adjust the PHP-FPM socket and the SSL
# lines to match how the other bayaneno.com subdomains are set up on the server.
server {
    listen 80;
    server_name nafas.bayaneno.com;
    root /home/bayaneno/domains/nafas/server-php/public;

    location /.well-known/acme-challenge/ { root /home/bayaneno/domains/nafas/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name nafas.bayaneno.com;
    root /home/bayaneno/domains/nafas/server-php/public;

    ssl_certificate     /etc/letsencrypt/live/nafas.bayaneno.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nafas.bayaneno.com/privkey.pem;

    client_max_body_size 16k;
    access_log /var/log/nginx/nafas.access.log;
    error_log  /var/log/nginx/nafas.error.log;

    # Only the front controller is ever executed.
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/php7.4-fpm.sock;  # <- replace with the real php74-fpm socket
    }
}
